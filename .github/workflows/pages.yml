name: Publish panel page

# ไฟล์นี้ไฟล์เดียวมีหน้าเว็บแผงโหมดเกมฝังอยู่ข้างใน
# วางที่ .github/workflows/pages.yml แล้วรันที่แท็บ Actions

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

